name: Deploy ArtBalkon to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
      timezone: Europe/Moscow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci
      - name: Build static site
        env:
          SITE_BASE_PATH: /artbalkon-site/
          SITE_ORIGIN: https://ulin-roman.github.io/artbalkon-site
          SITE_STATIC_ONLY: 'true'
        run: |
          npm run build
          npm run check
          npm test
      - name: Check mail handler
        run: |
          php -l server/leads.php
          php -l server/mail-lib.php
          php scripts/mail.test.php
      - name: Check atomic FTP publisher
        run: python3 scripts/deploy-ftp.test.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Install Pages artifact readiness client
        run: npm install --prefix "$RUNNER_TEMP/pages-artifact-client" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @actions/artifact@2.1.3
      - name: Wait for Pages artifact metadata
        timeout-minutes: 3
        uses: actions/github-script@v7
        with:
          script: |
            const { DefaultArtifactClient } = require(process.env.RUNNER_TEMP + '/pages-artifact-client/node_modules/@actions/artifact');
            const client = new DefaultArtifactClient();
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { artifacts } = await client.listArtifacts();
              const matches = artifacts.filter(artifact => artifact.name === name);
              if (matches.length > 1) throw new Error('Ambiguous Pages artifact: ' + name);
              if (matches.length === 1 && matches[0].size > 0) {
                core.info('Pages artifact ready: ' + name + ' (id ' + matches[0].id + ')');
                return;
              }
              core.info('Waiting for Pages artifact metadata: ' + attempt + '/12');
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Pages artifact metadata did not become visible: ' + name);
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          timeout: '600000'

      - name: Build for artbalkon.site
        env:
          SITE_BASE_PATH: /
          SITE_ORIGIN: https://artbalkon.site
          SITE_MAIL_FORMS: 'true'
        run: |
          npm run build
          npm run check

      - name: Deploy to REG.RU
        env:
          FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          FTP_USER: ${{ secrets.REG_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 scripts/deploy-ftp.py --local-dir dist --remote-dir .

      - name: Verify production redirects and form endpoint
        run: |
          python3 scripts/verify-mail-host.py
