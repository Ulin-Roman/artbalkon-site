name: Deploy ArtBalkon to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci
      - name: Build static site
        env:
          SITE_BASE_PATH: /artbalkon-site/
          SITE_ORIGIN: https://ulin-roman.github.io/artbalkon-site
          SITE_STATIC_ONLY: 'true'
        run: |
          npm run build
          npm run check
          npm test
      - name: Check mail handler
        run: |
          php -l server/leads.php
          php -l server/mail-lib.php
          php scripts/mail.test.php
      - name: Check atomic FTP publisher
        run: python3 scripts/deploy-ftp.test.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build for artbalkon.site
        env:
          SITE_BASE_PATH: /
          SITE_ORIGIN: https://artbalkon.site
          SITE_MAIL_FORMS: 'true'
        run: |
          npm run build
          npm run check

      - name: Deploy to REG.RU
        env:
          FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          FTP_USER: ${{ secrets.REG_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 scripts/deploy-ftp.py --local-dir dist --remote-dir .

      - name: Verify production redirects and form endpoint
        run: |
          python3 scripts/verify-mail-host.py
